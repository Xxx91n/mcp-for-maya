[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-for-maya"
version = "0.3.0"
description = "MCP server giving AI agents spatial awareness of Autodesk Maya scenes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["maya", "mcp", "autodesk", "3d", "animation", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
    "fastmcp>=2.14.0,<4.0.0",
    "platformdirs>=4.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "ruff>=0.1.0",
    "mypy==2.3.1",
    "mypy-baseline==0.7.4",
    "types-maya-strict==2025.0.6",
    "types-psutil==7.2.2.20260906",
    "PySide6",
    "types-PySide6==6.10.3.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
mcp-for-maya = "maya_mcp_server.__main__:main"
maya-mcp-server = "maya_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/Xxx91n/mcp-for-maya"
Repository = "https://github.com/Xxx91n/mcp-for-maya"
Issues = "https://github.com/Xxx91n/mcp-for-maya/issues"

[tool.hatch.build.targets.sdist]
# .github/ holds GitHub-facade source assets (~2.5MB) — dead weight in the
# source distribution. Wheel stays unchanged (it only ships src/ anyway).
exclude = [".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/maya_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "mayapy: requires a real Maya interpreter (mayapy) — local manual tier, never CI",
    "gui: requires a live Maya GUI session (MAYA_MCP_GUI_ADDR or :7001) — manual tier, real asserts (D-049a)",
    "human_verify: manual checklist skeletons — prints steps, never asserts, always skips (D-049a)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["maya_mcp_server"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.per-file-ignores]
# The maya stub must mirror Maya's camelCase API surface verbatim
"tests/maya_stub/**" = ["N802", "N803", "N806", "N815", "F401"]
# Showcase scene generators: Maya-domain idioms — module aliases (K/MV),
# uppercase dim locals (H/R/L/PY/DY), terse one-line guards
".github/assets-src/**" = ["N803", "N806", "N812", "E701", "E741"]

[tool.mypy]
python_version = "3.10"
strict = true
# ratchet pawls (ADR-0017): unused ignores/config entries must surface immediately
warn_unused_ignores = true
warn_unused_configs = true
