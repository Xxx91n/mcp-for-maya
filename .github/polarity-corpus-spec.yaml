{
  "schema": "polarity-corpus-spec/1",
  "note": "JSON-syntax YAML (YAML 1.2 is a strict superset of JSON): stdlib-only consumption via json.loads, no PyYAML. SINGLE SOURCE for the polarity-corpus sample-size floors, extracted out of .github/scripts/polarity_corpus_probe.py by D-214 (expected-value external derivation: a value that moves when a governance ruling moves belongs in a spec file, not in code). This is a GOVERNANCE spec, not a baseline -- unlike .github/ruff-baseline.json or mypy-baseline.txt it is never regenerated from an object; hand-edit it in the PR that carries the ruling.",
  "MIN_ADJUDICABLE": 12,
  "MIN_ADJUDICABLE_basis": "D-203 2: the value is ratified, not re-derived here. 12 is the figure D-203 legislated for the TN+F caliber, carried over from the pre-D-203 number rather than recomputed from this corpus -- recomputing a floor from the sample it gates is circular. The argument is a COVERAGE argument, not a statistical one (D-203 marks it as engineering derivation / analogy, no precedent): 12 >= track 3's 8 construction classes (4 cue x prefix + 4 split) + 2 exemption-phrase families + 2 slack, i.e. at least one verdict-carrying sample per known construction class, test262-style.",
  "MIN_ADJUDICABLE_caliber": "Counts ONLY the labels that carry a verdict about the guard: true_negative + forgiven. known_limitation is EXCLUDED by D-203 1 -- those samples record a clause-scope trade the design made on purpose (D-190 1), they can never move a verdict, and counting them let the corpus reach a floor by adding sentences that adjudicate nothing. D-203 also rules the Ro3 n>=30 anchor OUT of this floor: it governs rate upper bounds, not label agreement, and is parked as the reference anchor for a future D-198 5 rate threshold.",
  "MIN_ADJUDICABLE_counting_unit": "Each labelled sample counts ONCE, not once per guarded element. D-221 2 (S4): the tally used to sit inside the per-element loop, so the floor numerator was inflated by the number of guarded elements and the floor could be cleared with a fraction of the samples it claims to require.",
  "MIN_ADJUDICABLE_precondition_caveat": "D-198 5: clearing this floor is ONE of the two preconditions for warn->hard promotion of the TDQS gate, not the whole gate. The other is the PRIMARY track reporting zero false rejections. A run that clears the floor and still shows a false rejection is NOT a promotion.",
  "MIN_TN_PER_ELEMENT": 3,
  "MIN_TN_PER_ELEMENT_basis": "D-203 3: a corpus-wide floor is not enough. One element carrying every sample would satisfy it while that element is the only one the guard ever runs on. Each guarded element must independently carry at least this many true negatives -- the anti-dilution floor for widening the guard without growing the corpus."
}
