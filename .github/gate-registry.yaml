  "schema": "gate-registry/1",
  "note": "JSON-syntax YAML (YAML 1.2 is a strict superset of JSON): stdlib-only consumption via json.loads, no PyYAML. THE PIN REGISTRY of ADR-0029 section 5 / D-215. It is an INDEX VIEW, never a second source of expected values: expected_sources only POINTS at where an expectation is derived (path or path::symbol) and deliberately copies no value out of it. HAND-AUTHORED per D-215 -- no script may generate or rewrite this file; .github/scripts/check_gate_registry.py only reads it and reports the set difference against the machine enumeration of .github/scripts/*.py. The rulings this file implements (five-tier bound classes, the warning-to-blocking flip condition, the residual-blind-spot disclosure, the exemption discipline) live in ADR-0029 section 5 and are cited from there rather than restated here, so the machine-read surface stays small enough to review by eye.",
  "bound_classes": {
    "gate": "CI-blocking decision gate. Full D-212 tier-1 obligation: external derivation plus at least one resolving pin, and it must actually be wired into a workflow or the checker reports verdict drift.",
    "manual_preflight": "A human-run preflight row. Exempt from machine pins but carries the D-082 7 evidence-pointer obligation (environment + exit code + artifact path triple).",
    "instrument": "A measurement instrument with NO veto power. Its pin obligation is downgraded to the sensitivity track: inject a known fault and require a non-zero verdict. Zero pin_node_ids is legal here, but the entry must then say so in its note so an empty list reads as a decision rather than an oversight."
  },
