  "note": "JSON-syntax YAML (YAML 1.2 is a strict superset of JSON): stdlib-only consumption via json.loads, no PyYAML. SINGLE SOURCE for the assets-only-grow guard's protected prefixes, extracted out of .github/scripts/check_assets_append_only.py by D-214. Governance spec, not a baseline -- never regenerated; hand-edit in the PR that carries the ruling.",
  "GUARDED": [".github/assets/"],
  "GUARDED_basis": "D-082 6-5: files under .github/assets/ are added, never deleted, renamed, or edited in place. README imagery is referenced by absolute main-branch URLs and every already-published PyPI page renders main forever, so deleting, renaming, or editing an already-published asset permanently changes what every historical release page shows. The guard enforces this with --diff-filter=DMRT (D-113), so a modified file fails the job too, not only a deleted or renamed one. New captures get NEW filenames; retirement happens in README prose, never by file deletion. Governance constant by the D-214 litmus: widening or narrowing what is protected is a ruling change, not a code tweak."
