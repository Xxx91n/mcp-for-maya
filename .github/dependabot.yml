version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # D-089 -> D-099/D-100: fastmcp semver-major stays frozen —
    # PR #18/#36 went red on the fastmcp API surface (migration-class
    # bump, not a version-pin fix; the earlier camelCase->snake_case
    # attribution is being root-cause-corrected by the R25 spike, which
    # covers both red histories). Exploration window re-aimed to
    # fastmcp-4.x (GA 2026-08-31, 10 patches; upstream archived v3
    # docs): probe branch fastmcp>=4,<5 -> structured report -> if
    # all-green, tighten to >=4.x,<5.0.0 with a comment citing the CI
    # red history; if red, per-item migration debts with triggers.
    ignore:
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]
