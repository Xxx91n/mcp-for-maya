version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # D-089 -> D-099/D-100/D-105: fastmcp semver-major stays frozen.
    # The 4.x migration LANDED in T-26e (pin now >=4.0.0,<5.0.0 —
    # R1-R3 test/API renames applied; the spike's "red" was corrected
    # to decorator-returns-fn + fastmcp.tools.tool removal +
    # ToolAnnotations snake_case kwargs, not a camelCase bridge
    # failure). The major-version freeze stays: upstream's releases
    # policy allows breaking changes on MINOR bumps, so every major
    # still needs a migration PR — semver-major ignore remains the
    # correct guard, and the weekly drift canary (ci.yml) is the
    # earliest detector for any new-major resolution break.
    ignore:
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]
